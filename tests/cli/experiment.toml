[mappings]
GREETING = "hello"

[setups.setup]
type = "exec"
program = "echo"
args = ["SETUP $EMTORCH_CASE_ID $GREETING"]

[monitoring.count]
type = "logger-int-matcher"
value = "count"
pattern = "count=(?P<value>\\d+)"
subtask = "actions.process"

[monitoring.size]
type = "logger-int-matcher"
value = "size"
pattern = "size=(?P<value>\\d+)"
subtask = "actions.process"

[actions.process]
type = "shell"
cmd = "cat $EMTORCH_DATA_PATH"

[checks.report]
type = "file-write"
path = "report.txt"
append = true
contents = "$EMTORCH_CASE_ID done\n"
