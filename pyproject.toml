[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "emtorch"
description="Experiments orchestrator for embedded systems"
requires-python = ">= 3.13"
dependencies = [
  "paramiko==5.0.0",
]
authors = [
    {name = "Konrad Grochowski", email = "Konrad.Grochowski@pw.edu.pl"},
    {name = "Krzysztof Cabaj", email = "Krzysztof.Cabaj@pw.edu.pl"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = [
  "embedded",
  "testing",
  "experiments",
  "orchestrator",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Testing",
]
dynamic = ["version"]

[project.urls]
GitHub="https://github.com/ZBOSK-II/emtorch"
ChangeLog="https://github.com/ZBOSK-II/emtorch/blob/master/CHANGELOG.md"

[project.scripts]
emtorch = "emtorch.__main__:main"

[tool.poetry]
packages = [{include = "emtorch"}]
requires-poetry = ">=2.1.2"
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }
poetry-plugin-export = ">=1.9"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
codespell = "2.4.2"
flake8 = "7.3.0"
flake8-pyproject = "1.2.4"
isort = "8.0.1"
mypy = "2.1.0"
pylint = "4.0.5"
pytest = "9.0.3"
types-paramiko = "4.0.0.20260518"

[tool.mypy]
strict = true

[tool.isort]
profile = "black"
skip_gitignore = true
line_length = 100

[tool.flake8]
max-line-length = 100
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  ".poetry",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = "tests"

[tool.pylint.main]
ignore = [
  "__pycache__",
  ".venv",
  ".git",
  ".poetry",
]
jobs = 0

[tool.pylint.format]
max-line-length = 100

[tool.pylint.logging]
logging-format-style = "new"

[tool.pylint."messages control"]
disable = [
  "missing-function-docstring",
  "missing-class-docstring", # TODO ?
  "logging-fstring-interpolation",
]
enable = [
  "useless-suppression",
]

[tool.pylint.imports]
allow-reexport-from-package = true

[tool.codespell]
skip = "poetry.lock,*.pyc"
check-filenames = true
count = true
quiet = 0

[tool.poetry-dynamic-versioning]
enable = true
pattern = "default-unprefixed"
style = "semver"
