[mappings]
EXAMPLE_VAR = "example value"

[delays]
between_cases = 0.2

[setups.setup]
type = "exec"
program = "echo"
args = ["SETUP $EMTORCH_CASE_ID ($EXAMPLE_VAR)"]

[setups.ping]
type = "ping-alive"
host = "127.0.0.1"
timeout = 10
interval = 1

[monitoring.loop]
type = "shell"
cmd = "while true; do echo looping; sleep 1; done"
timeout = 5
signal = "SIGKILL"

[monitoring.logger]
type = "logger-int-matcher"
value = "logger"
pattern = "count\\s+=\\s+(?P<value>\\d+)"
subtask = "actions.test"

[actions.test]
type = "shell"
cmd = "cat $EMTORCH_DATA_PATH"

[actions.test.delays]
before = 0.5
after = 0.1

[actions.sleep]
type = "shell"
cmd = "sleep 2"
timeout = 3

[checks.ping]
type = "ping-stable"
host = "127.0.0.1"
count = 2
interval = 1

[checks.teardown]
type = "shell"
cmd = "echo TEARDOWN"
